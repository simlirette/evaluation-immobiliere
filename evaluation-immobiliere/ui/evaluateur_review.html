<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revue dossier</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #17212f;
      --muted: #667084;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --warn: #a15c00;
      --bad: #b42318;
      --ok: #087443;
      --soft: #eef2f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0;
      line-height: 1.4;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 16px 20px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      gap: 12px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
    }
    .panel { padding: 14px; }
    h2 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--muted);
      text-transform: uppercase;
    }
    button, select, textarea, input {
      font: inherit;
      border-radius: 6px;
    }
    button {
      min-height: 36px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      padding: 0 12px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    button.primary:hover { background: var(--accent-dark); }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    select, textarea, input {
      width: 100%;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
    }
    select, input {
      min-height: 38px;
      padding: 0 10px;
    }
    textarea {
      min-height: 112px;
      padding: 10px;
      resize: vertical;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th {
      color: var(--muted);
      font-weight: 700;
    }
    tr.selected { background: #e8f4f1; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: #f0f7f5; }
    .queue {
      max-height: calc(100vh - 180px);
      overflow: auto;
      border-top: 1px solid var(--line);
    }
    .queue.sessions {
      max-height: 300px;
      border-bottom: 1px solid var(--line);
    }
    .workspace {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .full { grid-column: 1 / -1; }
    .span2 { grid-column: span 2; }
    .metric {
      background: #fbfcfd;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-height: 78px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .toolbar button { flex: 1 1 auto; }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 0 9px;
      background: var(--soft);
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
    }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .muted { color: var(--muted); font-size: 13px; }
    pre {
      margin: 0;
      max-height: 320px;
      overflow: auto;
      background: #111827;
      color: #f9fafb;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin: 10px 0 5px;
    }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .workspace { grid-template-columns: 1fr; }
      .span2 { grid-column: 1 / -1; }
      .queue { max-height: 380px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Revue dossier</h1>
    <div class="muted" id="updated">Chargement...</div>
  </header>
  <main>
    <section>
      <div class="panel">
        <div class="toolbar">
          <button class="primary" id="refresh">Actualiser</button>
          <button id="start">Ouvrir dossier</button>
        </div>
        <div class="toolbar" id="authPanel"></div>
        <label for="sessionInput">Session existante</label>
        <input id="sessionInput" placeholder="session_id">
        <div class="toolbar">
          <button id="loadSession">Charger session</button>
        </div>
        <h2>File</h2>
        <div class="muted" id="queueCount">-</div>
      </div>
      <div class="queue">
        <table id="queueTable"></table>
      </div>
      <div class="panel">
        <h2>Sessions existantes</h2>
        <div class="muted" id="sessionCount">-</div>
      </div>
      <div class="queue sessions">
        <table id="sessionTable"></table>
      </div>
    </section>
    <section class="panel">
      <div class="workspace">
        <div class="metric">
          <span>Session</span>
          <strong id="session">-</strong>
        </div>
        <div class="metric">
          <span>Dossier</span>
          <strong id="dossier">-</strong>
        </div>
        <div class="metric">
          <span>Statut</span>
          <strong><span class="status" id="status">-</span></strong>
        </div>
        <div class="metric">
          <span>Warnings / blocages</span>
          <strong id="signals">-</strong>
        </div>
        <div class="metric">
          <span>Artefacts</span>
          <strong id="artifactCount">-</strong>
        </div>
        <div class="metric">
          <span>Integrite</span>
          <strong id="integrity">-</strong>
        </div>
        <div class="metric">
          <span>Decision</span>
          <strong id="reviewDecision">-</strong>
        </div>
        <div class="metric">
          <span>Action suivante</span>
          <strong id="nextAction">-</strong>
        </div>
        <div class="full">
          <h2>Synthese dossier</h2>
          <table id="dossierSummary"></table>
        </div>
        <div class="span2">
          <h2>Comparables</h2>
          <table id="comparables"></table>
        </div>
        <div>
          <h2>Valeurs</h2>
          <table id="valuation"></table>
        </div>
        <div class="full">
          <h2>Apercu rapport</h2>
          <pre id="reportPreview">{}</pre>
        </div>
        <div class="span2">
          <h2>Artefacts</h2>
          <table id="artifacts"></table>
        </div>
        <div>
          <h2>Decision</h2>
          <label for="decision">Statut</label>
          <select id="decision">
            <option value="PRET_REVUE">PRET_REVUE</option>
            <option value="A_CORRIGER">A_CORRIGER</option>
            <option value="VALIDE">VALIDE</option>
            <option value="REJETE">REJETE</option>
          </select>
          <label for="reviewer">Relecteur</label>
          <input id="reviewer" value="QA produit">
          <label for="notes">Notes</label>
          <textarea id="notes"></textarea>
          <div class="toolbar">
            <button class="primary" id="saveReview">Enregistrer</button>
            <button id="resume">Reprise</button>
          </div>
        </div>
        <div class="full">
          <h2>Artefact ouvert</h2>
          <pre id="artifactDetail">{}</pre>
        </div>
        <div class="full">
          <h2>Evenements</h2>
          <pre id="events">{}</pre>
        </div>
        <div class="full">
          <h2>Reponse</h2>
          <pre id="raw">{}</pre>
        </div>
      </div>
    </section>
  </main>
  <script src="/auth/client.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let queueRows = [];
    let sessionRows = [];
    let fixtures = [];
    let selected = null;
    let activeSession = null;
    let stream = null;

    async function json(url, options = {}) {
      return RuntimeAuth.fetchJson(url, options);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function priorityClass(value) {
      if (value === 'P1') return 'bad';
      if (value === 'P2') return 'warn';
      return '';
    }

    function renderQueue() {
      $('queueCount').textContent = `${queueRows.length} items`;
      $('queueTable').innerHTML = '<thead><tr><th>ID</th><th>P</th><th>Dossier</th><th>Type</th><th>Cible</th></tr></thead><tbody>' +
        queueRows.map((row, index) => `<tr data-index="${index}" class="${selected === row ? 'selected' : ''}"><td>${escapeHtml(row.id || '-')}</td><td class="${priorityClass(row.priority)}">${escapeHtml(row.priority || '-')}</td><td>${escapeHtml(row.dossier_id || '-')}</td><td>${escapeHtml(row.item_type || '-')}</td><td>${escapeHtml(row.target || '-')}</td></tr>`).join('') +
        '</tbody>';
      document.querySelectorAll('#queueTable tbody tr').forEach((tr) => {
        tr.addEventListener('click', () => {
          selected = queueRows[Number(tr.dataset.index)];
          $('notes').value = `${selected.id} ${selected.question || ''}`.trim();
          renderQueue();
        });
      });
    }

    function renderSessions() {
      $('sessionCount').textContent = `${sessionRows.length} sessions`;
      $('sessionTable').innerHTML = '<thead><tr><th>Session</th><th>Dossier</th><th>Decision</th><th>Action</th></tr></thead><tbody>' +
        sessionRows.map((row) => `<tr class="clickable ${activeSession && activeSession.session_id === row.session_id ? 'selected' : ''}" data-session-id="${escapeHtml(row.session_id || '')}"><td>${escapeHtml(row.session_id || '-')}</td><td>${escapeHtml(row.dossier_id || '-')}</td><td>${escapeHtml(row.review_decision || '-')}</td><td>${escapeHtml(row.next_action || '-')}</td></tr>`).join('') +
        '</tbody>';
      document.querySelectorAll('#sessionTable tbody tr').forEach((tr) => {
        tr.addEventListener('click', () => {
          const sessionId = tr.dataset.sessionId;
          $('sessionInput').value = sessionId;
          loadSessionSummary(sessionId).then(openStream).catch((error) => $('raw').textContent = error.message);
        });
      });
    }

    function fixtureForSelected() {
      if (!selected) return null;
      return fixtures.find((fixture) => fixture.dossier_id === selected.dossier_id);
    }

    async function refresh() {
      const [queue, fixtureData, workbench] = await Promise.all([json('/ops/review_queue'), json('/fixtures'), json('/review/workbench')]);
      queueRows = queue.rows || [];
      fixtures = fixtureData.fixtures || [];
      sessionRows = workbench.sessions || [];
      if (!selected && queueRows.length) selected = queueRows[0];
      renderQueue();
      renderSessions();
      $('updated').textContent = `Derniere actualisation: ${new Date().toLocaleString()}`;
    }

    async function openSelected() {
      const fixture = fixtureForSelected();
      if (!fixture) throw new Error('Fixture introuvable pour le dossier selectionne');
      const payload = await json('/start', {
        method: 'POST',
        body: JSON.stringify({ fixture: fixture.name, strict_mode: true })
      });
      activeSession = payload.session;
      $('sessionInput').value = activeSession.session_id;
      await loadSessionSummary(activeSession.session_id);
      openStream();
    }

    async function loadSessionSummary(sessionId) {
      const payload = await json(`/session/summary?session_id=${encodeURIComponent(sessionId)}`);
      activeSession = payload.session;
      $('session').textContent = activeSession.session_id;
      $('dossier').textContent = payload.result.dossier_id || activeSession.dossier_id || '-';
      $('status').textContent = payload.result.status || activeSession.status || '-';
      $('signals').textContent = `${(payload.result.warnings || []).length} / ${(payload.result.blocking_failures || []).length}`;
      $('artifactCount').textContent = payload.artifacts.artifacts_count || 0;
      $('integrity').textContent = payload.integrity.ok ? 'OK' : 'A verifier';
      const sessionRecord = sessionRows.find((row) => row.session_id === activeSession.session_id) || {};
      $('reviewDecision').textContent = payload.review.decision || activeSession.review_decision || sessionRecord.review_decision || 'A_SAISIR';
      $('nextAction').textContent = sessionRecord.next_action || (payload.integrity.ok ? 'SAISIR_DECISION' : 'VERIFIER_INTEGRITE');
      $('raw').textContent = JSON.stringify(payload, null, 2);
      renderArtifacts(payload.artifacts || {});
      renderSessions();
      await loadDossierReview(activeSession.session_id);
    }

    function renderArtifacts(payload) {
      const rows = (payload.artifacts || []).slice(0, 48);
      $('artifacts').innerHTML = '<thead><tr><th>Step</th><th>Artefact</th><th>Bytes</th><th>SHA-256</th></tr></thead><tbody>' +
        rows.map((row) => `<tr class="clickable" data-event-id="${escapeHtml(row.event_id || '')}"><td>${escapeHtml(row.step || '-')}</td><td>${escapeHtml(row.artifact || '-')}</td><td>${escapeHtml(row.bytes || 0)}</td><td>${escapeHtml(String(row.sha256 || '').slice(0, 12))}</td></tr>`).join('') +
        '</tbody>';
      document.querySelectorAll('#artifacts tbody tr').forEach((tr) => {
        tr.addEventListener('click', () => openArtifact(tr.dataset.eventId).catch((error) => $('artifactDetail').textContent = error.message));
      });
    }

    async function openArtifact(eventId) {
      if (!activeSession) throw new Error('Aucune session active');
      if (!eventId) throw new Error('event_id artefact manquant');
      const params = new URLSearchParams({ session_id: activeSession.session_id, event_id: eventId });
      const payload = await json(`/artifact?${params.toString()}`);
      const rendered = payload.json ? JSON.stringify(payload.json, null, 2) : payload.text;
      $('artifactDetail').textContent = `${payload.artifact.step}.${payload.artifact.artifact}\n${payload.bytes} bytes${payload.truncated ? ' - tronque' : ''}\n\n${rendered}`;
    }

    async function loadDossierReview(sessionId) {
      const payload = await json(`/review/dossier?session_id=${encodeURIComponent(sessionId)}`);
      renderDossierReview(payload);
    }

    function renderDossierReview(payload) {
      $('dossierSummary').innerHTML = `<tbody>
        <tr><th>Dossier</th><td>${escapeHtml(payload.dossier_id || '-')}</td></tr>
        <tr><th>Date reference</th><td>${escapeHtml(payload.facts.date_reference || '-')}</td></tr>
        <tr><th>Confiance</th><td>${escapeHtml(payload.facts.confidence ?? '-')}</td></tr>
        <tr><th>Sources</th><td>${escapeHtml(payload.facts.source_ids_count ?? 0)}</td></tr>
        <tr><th>Conformite</th><td><span class="status">${escapeHtml(payload.compliance.status || '-')}</span></td></tr>
        <tr><th>Couverture</th><td>${escapeHtml(payload.coverage.required_count - payload.coverage.missing_count)} / ${escapeHtml(payload.coverage.required_count)}</td></tr>
      </tbody>`;
      const compRows = (payload.comparables.items || []).map((item) => `<tr>
        <td>${escapeHtml(item.comparable_id || '-')}</td>
        <td>${escapeHtml(item.prix_vente ?? '-')}</td>
        <td>${escapeHtml(item.score ?? '-')}</td>
        <td>${escapeHtml(item.source_id || '-')}</td>
      </tr>`).join('');
      $('comparables').innerHTML = `<thead><tr><th>ID</th><th>Prix</th><th>Score</th><th>Source</th></tr></thead><tbody>${compRows}</tbody>`;
      const valueRows = (payload.valuation.approaches || []).map((item) => `<tr>
        <td>${escapeHtml(item.approach || '-')}</td>
        <td>${escapeHtml(item.value ?? '-')}</td>
        <td>${escapeHtml(item.input_count ?? 0)}</td>
      </tr>`).join('');
      $('valuation').innerHTML = `<thead><tr><th>Approche</th><th>Valeur</th><th>Inputs</th></tr></thead><tbody>${valueRows}</tbody>`;
      $('reportPreview').textContent = payload.report.preview || 'Rapport non disponible pour cette session.';
    }

    function openStream() {
      if (!activeSession) return;
      const events = [];
      stream = RuntimeAuth.fetchEventStream(activeSession.events_url, (name, data) => {
        events.push({ event: name, data });
        $('events').textContent = JSON.stringify(events.slice(-80), null, 2);
      }).catch((error) => $('events').textContent = error.message);
    }

    async function saveReview() {
      if (!activeSession) throw new Error('Aucune session active');
      const payload = await json('/review', {
        method: 'POST',
        body: JSON.stringify({
          session_id: activeSession.session_id,
          decision: $('decision').value,
          reviewer: $('reviewer').value,
          notes: $('notes').value
        })
      });
      $('raw').textContent = JSON.stringify(payload, null, 2);
      await refresh();
      await loadSessionSummary(activeSession.session_id);
    }

    async function resume() {
      if (!activeSession) throw new Error('Aucune session active');
      const payload = await json('/resume', {
        method: 'POST',
        body: JSON.stringify({ session_id: activeSession.session_id })
      });
      $('raw').textContent = JSON.stringify(payload, null, 2);
      await loadSessionSummary(activeSession.session_id);
    }

    $('refresh').addEventListener('click', () => refresh().catch((error) => $('raw').textContent = error.message));
    $('start').addEventListener('click', () => openSelected().catch((error) => $('raw').textContent = error.message));
    $('loadSession').addEventListener('click', () => loadSessionSummary($('sessionInput').value.trim()).then(openStream).catch((error) => $('raw').textContent = error.message));
    $('saveReview').addEventListener('click', () => saveReview().catch((error) => $('raw').textContent = error.message));
    $('resume').addEventListener('click', () => resume().catch((error) => $('raw').textContent = error.message));

    async function bootstrap() {
      await refresh();
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id') || '';
      if (sessionId) {
        $('sessionInput').value = sessionId;
        await loadSessionSummary(sessionId);
        openStream();
      }
    }

    RuntimeAuth.mount('authPanel');
    bootstrap().catch((error) => $('raw').textContent = error.message);
  </script>
</body>
</html>
