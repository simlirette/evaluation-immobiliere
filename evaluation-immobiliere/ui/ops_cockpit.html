<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops runtime immobilier</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #18202a;
      --muted: #667084;
      --line: #d9dee7;
      --accent: #0f766e;
      --warn: #a15c00;
      --bad: #b42318;
      --ok: #087443;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }
    header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 16px 32px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .metric {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .wide { grid-column: span 2; }
    .full { grid-column: 1 / -1; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th {
      color: var(--muted);
      font-weight: 700;
    }
    pre {
      margin: 0;
      max-height: 360px;
      overflow: auto;
      background: #111827;
      color: #f9fafb;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.45;
    }
    .muted { color: var(--muted); }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .wide { grid-column: 1 / -1; }
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      header { padding: 16px; }
      main { padding: 14px 10px 24px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Ops runtime immobilier</h1>
    <div class="muted" id="updated">Chargement...</div>
  </header>
  <main>
    <div class="toolbar">
      <button class="primary" id="refresh">Actualiser</button>
      <button id="dryRun">Dry-run pre-reponses</button>
      <button id="run">Executer pre-reponses</button>
    </div>
    <section class="grid">
      <div class="panel">
        <h2>Readiness</h2>
        <div class="metric" id="readiness">-</div>
      </div>
      <div class="panel">
        <h2>Dossiers</h2>
        <div class="metric" id="cases">-</div>
      </div>
      <div class="panel">
        <h2>File humaine</h2>
        <div class="metric" id="queue">-</div>
      </div>
      <div class="panel">
        <h2>Runs</h2>
        <div class="metric" id="runs">-</div>
      </div>
      <div class="panel wide">
        <h2>Risques</h2>
        <table id="risks"></table>
      </div>
      <div class="panel wide">
        <h2>Contrats infra</h2>
        <table id="contracts"></table>
      </div>
      <div class="panel full">
        <h2>Revue humaine</h2>
        <table id="reviewQueue"></table>
      </div>
      <div class="panel full">
        <h2>Derniere reponse</h2>
        <pre id="raw">{}</pre>
      </div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);

    async function getJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    function classForStatus(value) {
      if (!value) return '';
      if (String(value).includes('PRET') || value === 'OK') return 'ok';
      if (String(value).includes('A_CORRIGER') || String(value).includes('ABSENT')) return 'bad';
      return 'warn';
    }

    function renderObjectTable(table, obj) {
      const rows = Object.entries(obj || {});
      table.innerHTML = '<tbody>' + rows.map(([key, value]) =>
        `<tr><th>${key}</th><td>${JSON.stringify(value)}</td></tr>`
      ).join('') + '</tbody>';
    }

    function renderReviewQueue(report) {
      const rows = (report.rows || []).slice(0, 40);
      $('reviewQueue').innerHTML = '<thead><tr><th>ID</th><th>Priorite</th><th>Dossier</th><th>Type</th><th>Cible</th><th>Question</th></tr></thead><tbody>' +
        rows.map(row => `<tr><td>${row.id || '-'}</td><td>${row.priority || '-'}</td><td>${row.dossier_id || '-'}</td><td>${row.item_type || '-'}</td><td>${row.target || '-'}</td><td>${row.question || '-'}</td></tr>`).join('') +
        '</tbody>';
    }

    async function refresh() {
      const [summary, readiness, contracts, queue] = await Promise.all([
        getJson('/ops'),
        getJson('/ops/readiness'),
        getJson('/ops/infra_contracts'),
        getJson('/ops/review_queue')
      ]);
      $('readiness').textContent = summary.readiness_status || '-';
      $('readiness').className = `metric ${classForStatus(summary.readiness_status)}`;
      $('cases').textContent = summary.quality_cases_count ?? '-';
      $('queue').textContent = summary.review_queue_items ?? '-';
      $('runs').textContent = summary.registry_runs_count ?? '-';
      renderObjectTable($('risks'), readiness.risks_to_calibrate || {});
      renderObjectTable($('contracts'), {
        ok: contracts.ok,
        files_checked: contracts.files_checked,
        files_invalid: contracts.files_invalid
      });
      renderReviewQueue(queue);
      $('raw').textContent = JSON.stringify({ summary, readiness }, null, 2);
      $('updated').textContent = `Derniere actualisation: ${new Date().toLocaleString()}`;
    }

    async function runChain(dryRun) {
      const payload = await fetch('/ops/pre-response-run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dry_run: dryRun })
      }).then(async response => {
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || response.statusText);
        return body;
      });
      $('raw').textContent = JSON.stringify(payload, null, 2);
      await refresh();
    }

    $('refresh').addEventListener('click', refresh);
    $('dryRun').addEventListener('click', () => runChain(true).catch(err => $('raw').textContent = err.message));
    $('run').addEventListener('click', () => runChain(false).catch(err => $('raw').textContent = err.message));
    refresh().catch(err => $('raw').textContent = err.message);
  </script>
</body>
</html>
