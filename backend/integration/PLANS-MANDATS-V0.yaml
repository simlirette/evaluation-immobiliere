version: 0.1
# Plans par type de mandat — routing orchestrateur
# Chaque plan définit le format de rapport, les méthodes requises et la méthode prépondérante
# conformément aux normes CUSPAP 2026 et NPP OEAQ.

plans:

  residentiel_standard:
    label: "Résidentiel standard (unifamilial, jumelé, en rangée, condo)"
    format_rapport: abrege
    methodes_requises:
      - approche_comparative
      - approche_cout
    methodes_optionnelles:
      - approche_revenu
    methode_preponderante: approche_comparative
    umpp_requis: true
    visite_physique: obligatoire
    notes: >
      Approche comparative prépondérante (preuve directe).
      Coût = limite supérieure (preuve indirecte, substitution).
      Revenu non applicable sauf immeuble avec revenus accessoires.

  residentiel_multifamilial:
    label: "Résidentiel multifamilial (duplex, triplex, 4-plex, 5-plex)"
    format_rapport: abrege
    methodes_requises:
      - approche_comparative
      - approche_revenu
    methodes_optionnelles:
      - approche_cout
    methode_preponderante: approche_comparative
    umpp_requis: true
    visite_physique: obligatoire
    notes: >
      Comparative prépondérante pour 2-5 logements.
      Revenu requis pour documenter le potentiel locatif.
      Format narratif complet si > 5 logements → reclasser en immeuble_revenus.

  immeuble_revenus:
    label: "Immeuble à revenus (6 logements et +, commercial générateur)"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_revenu
      - approche_comparative
    methodes_optionnelles:
      - approche_cout
    methode_preponderante: approche_revenu
    umpp_requis: true
    visite_physique: obligatoire
    notes: >
      Revenu prépondérante (attitude investisseur).
      Comparative = contre-preuve de marché.
      Coût = limite supérieure (neuf seulement, sinon informatif).
      Normalisation revenus/dépenses obligatoire (RBP → RBE → RNE → TGA).

  commercial:
    label: "Commercial non générateur (bureaux, détail, institutionnel)"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_comparative
      - approche_cout
    methodes_optionnelles:
      - approche_revenu
    methode_preponderante: approche_comparative
    umpp_requis: true
    visite_physique: obligatoire
    notes: >
      Comparative prépondérante si ventes disponibles ($/pi²).
      Coût requis pour bâtiments spéciaux ou marché mince.
      Revenu si immeuble locatif commercial avec baux disponibles.

  industriel:
    label: "Industriel (entrepôt, manufacture, parc industriel)"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_comparative
      - approche_cout
    methodes_optionnelles:
      - approche_revenu
    methode_preponderante: approche_comparative
    umpp_requis: true
    visite_physique: obligatoire
    notes: >
      Comparative $/pi² de bâtiment + $/m² terrain.
      Coût souvent prépondérant si marché de revente mince.
      Revenu applicable si actif loué (baux triple net).

  terrain:
    label: "Terrain vacant ou à développer"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_comparative
    methodes_optionnelles: []
    methode_preponderante: approche_comparative
    umpp_requis: true
    visite_physique: obligatoire
    notes: >
      Approche comparative en $/m² ou $/pi² de terrain.
      Méthode résiduelle si terrain à développer (UMPP = usage optimal).
      Coût non applicable (pas de bâtiment).
      Revenu non applicable (pas de revenus).

  mise_a_jour:
    label: "Mise à jour d'une évaluation antérieure"
    format_rapport: mise_a_jour
    methodes_requises:
      - approche_comparative
    methodes_optionnelles:
      - approche_cout
      - approche_revenu
    methode_preponderante: approche_comparative
    umpp_requis: false
    visite_physique: selon_etendue_travail
    notes: >
      Actualisation d'un rapport existant.
      Description immeuble = identification seulement + renvoi dossier.
      Brève référence aux méthodes + renvoi rapport original.
      Mention UMPP si changement de conditions depuis rapport original.

  assurance:
    label: "Fins d'assurance (valeur de remplacement)"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_cout
    methodes_optionnelles: []
    methode_preponderante: approche_cout
    umpp_requis: false
    visite_physique: obligatoire
    notes: >
      MÉTHODE DU COÛT SEULEMENT. La méthode du coût ne peut JAMAIS servir à
      la valeur marchande dans un mandat assurance.
      Inclusions/exclusions selon Annexe 2 NPP obligatoire.
      Mandat écrit signé obligatoire.
      Coût = remplacement (neuf équivalent fonctionnel) ou reproduction.

  # ── Mandats à date / définition de valeur particulière (T4.1 + T4.2) ────────

  succession:
    label: "Succession / donation / roulement corporatif (JVM)"
    definition_valeur: juste_valeur_marchande
    reference_normative: "LIR art. 70(5) / art. 69(1) — JVM à la date du décès ou du don"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_comparative
      - approche_cout
    methodes_optionnelles:
      - approche_revenu
    methode_preponderante: approche_comparative
    umpp_requis: true
    visite_physique: obligatoire
    date_retrospective: true
    notes: >
      JUSTE VALEUR MARCHANDE (JVM) au sens de la Loi de l'impôt sur le revenu.
      Date de référence RÉTROSPECTIVE imposée (date du décès ou du roulement).
      Tous les comparables et données de marché doivent être antérieurs à cette date.
      Définition JVM à citer explicitement : "le prix le plus élevé exprimé en dollars
      qu'un bien rapporterait sur un marché libre et ouvert..."
      Rapport narratif complet avec historique détaillé obligatoire.

  donation:
    label: "Donation / roulement (JVM — art. 69 LIR)"
    definition_valeur: juste_valeur_marchande
    reference_normative: "LIR art. 69(1) — JVM à la date du transfert"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_comparative
    methodes_optionnelles:
      - approche_cout
      - approche_revenu
    methode_preponderante: approche_comparative
    umpp_requis: true
    visite_physique: obligatoire
    date_retrospective: true
    notes: >
      JVM au sens LIR — même définition que succession.
      Date de référence = date du transfert (peut être rétrospective).

  contestation_role:
    label: "Contestation de rôle d'évaluation (valeur réelle — LFM)"
    definition_valeur: valeur_reelle
    reference_normative: "LFM art. 42 — valeur réelle à la date de référence triennale"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_comparative
    methodes_optionnelles:
      - approche_cout
      - approche_revenu
    methode_preponderante: approche_comparative
    umpp_requis: true
    visite_physique: obligatoire
    date_retrospective: true
    date_triennale: true
    notes: >
      VALEUR RÉELLE au sens de l'art. 42 LFM (pas la valeur marchande courante).
      Date de référence = 1er juillet de la 2e année du triennat précédent.
      Comparables doivent être contemporains à cette date triennale.
      Citer art. 42 LFM explicitement dans le rapport.
      Évaluation pour fins fiscales municipales — usage limité à la contestation.

  financement:
    label: "Financement hypothécaire (valeur marchande)"
    definition_valeur: valeur_marchande
    reference_normative: "NPP OEAQ / CUSPAP 2026 — valeur marchande standard"
    format_rapport: abrege
    methodes_requises:
      - approche_comparative
      - approche_cout
    methodes_optionnelles:
      - approche_revenu
    methode_preponderante: approche_comparative
    umpp_requis: true
    visite_physique: obligatoire
    notes: >
      Valeur marchande standard. Format abrégé habituel.
      Lender review requirements si prêteur institutionnel précisé.

  expropriation:
    label: "Expropriation (méthode avant-après)"
    definition_valeur: valeur_marchande
    reference_normative: "Loi sur l'expropriation (RLRQ c. E-24) — indemnité = avant - après + préjudices"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_comparative
      - approche_cout
    methodes_optionnelles:
      - approche_revenu
    methode_preponderante: approche_avant_apres
    umpp_requis: true
    visite_physique: obligatoire
    notes: >
      MÉTHODE AVANT-APRÈS OBLIGATOIRE.
      Indemnité = Valeur entière (avant) − Valeur résidu (après) + Préjudices accessoires.
      Deux évaluations distinctes dans le rapport : bien entier + résidu post-expropriation.
      Préjudices : dépréciation par contiguïté, perte de valeur résiduelle, frais déménagement si applicable.

  liquidation:
    label: "Liquidation / vente forcée ordonnée"
    definition_valeur: valeur_liquidation
    reference_normative: "NPP OEAQ — valeur de liquidation ordonnée"
    format_rapport: narratif_complet
    methodes_requises:
      - approche_comparative
    methodes_optionnelles:
      - approche_cout
      - approche_revenu
    methode_preponderante: approche_comparative
    umpp_requis: false
    visite_physique: obligatoire
    notes: >
      VALEUR DE LIQUIDATION = valeur marchande − décote justifiée.
      Décote motivée par contraintes de temps (période d'exposition réduite),
      contexte de vente forcée, et données de marché comparables de liquidation.
      La décote doit être quantifiée et documentée (% du VM standard).
      Distinction liquidation ordonnée (temps raisonnable contraint) vs forcée (immédiate).

