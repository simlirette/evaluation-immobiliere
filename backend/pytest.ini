[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers (timeout nécessite pytest-timeout — ajouter à requirements-dev.txt si souhaité)
markers =
    network: test nécessite accès réseau réel
    slow: test lent (> 30s)
    e2e: test de bout en bout

# Filtrer les warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
