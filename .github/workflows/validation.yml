name: Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-and-matrix:
    name: Runtime and matrix checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python files
        run: |
          python -m py_compile \
            evaluation-immobiliere/api.py \
            evaluation-immobiliere/engine/audit.py \
            evaluation-immobiliere/engine/runtime.py \
            evaluation-immobiliere/engine/skills.py \
            evaluation-immobiliere/engine/tools.py \
            evaluation-immobiliere/engine/valuation.py \
            evaluation-immobiliere/outils/lancer_api_v0.py \
            evaluation-immobiliere/outils/demo_api_v0.py \
            evaluation-immobiliere/outils/executer_dossiers_pilotes_reels_v0.py \
            evaluation-immobiliere/outils/analyser_qualite_runtime_v0.py \
            evaluation-immobiliere/outils/generer_bench_perf_cout_v0.py \
            evaluation-immobiliere/outils/generer_livrables_cicd_v0.py \
            evaluation-immobiliere/outils/generer_livrables_preprod_v0.py \
            evaluation-immobiliere/outils/generer_livrables_deploiement_v0.py \
            evaluation-immobiliere/outils/generer_livrables_hypercare_v0.py \
            evaluation-immobiliere/outils/calibrer_reponses_evaluateurs_v0.py \
            evaluation-immobiliere/outils/generer_manifest_runtime_v0.py \
            evaluation-immobiliere/outils/verifier_readiness_pre_reponses_v0.py \
            evaluation-immobiliere/outils/generer_file_revue_humaine_v0.py \
            evaluation-immobiliere/outils/auditer_anonymisation_v0.py \
            evaluation-immobiliere/outils/generer_knowledge_snapshot_v0.py \
            evaluation-immobiliere/outils/executer_pre_reponses_v0.py \
            evaluation-immobiliere/outils/generer_registry_runtime_v0.py \
            evaluation-immobiliere/outils/valider_rapports_infra_v0.py \
            evaluation-immobiliere/outils/generer_rapport_pilote_runtime_v0.py \
            evaluation-immobiliere/outils/preparer_ingestion_pdf_v0.py \
            evaluation-immobiliere/outils/preparer_durcissement_contrats_v0.py \
            evaluation-immobiliere/outils/preparer_paquet_evaluateurs_v0.py \
            evaluation-immobiliere/outils/preparer_revue_interne_pilotes_v0.py \
            evaluation-immobiliere/outils/simuler_runtime_engine_v0.py \
            evaluation-immobiliere/outils/verifier_point_arret_reponses_v0.py \
            evaluation-immobiliere/outils/verifier_coherence_runtime_v0.py \
            evaluation-immobiliere/outils/verifier_readiness_skills_v0.py \
            evaluation-immobiliere/outils/verifier_contrat_redaction_skills_v0.py \
            evaluation-immobiliere/outils/verifier_contrats_skills_agents_v0.py \
            evaluation-immobiliere/outils/verifier_contrats_artefacts_agents_v0.py \
            evaluation-immobiliere/outils/verifier_campagne_terrain_reelle_v1.py \
            evaluation-immobiliere/outils/verifier_statut_phases_projet_v1.py \
            evaluation-immobiliere/outils/verifier_homologation_metier_v0.py \
            evaluation-immobiliere/outils/verifier_revues_evaluateurs_externes_v1.py \
            evaluation-immobiliere/outils/verifier_fermeture_ecarts_evaluateurs_v1.py \
            evaluation-immobiliere/outils/verifier_release_candidate_v1.py \
            evaluation-immobiliere/outils/verifier_preuve_runtime_skills_v0.py \
            evaluation-immobiliere/outils/generer_registre_skills.py \
            evaluation-immobiliere/outils/valider_fixtures_v0.py \
            evaluation-immobiliere/outils/valider_reponses_evaluateurs.py \
            evaluation-immobiliere/outils/compiler_reponses_evaluateurs.py \
            evaluation-immobiliere/outils/prioriser_mvp.py

      - name: Validate evaluator responses
        run: python evaluation-immobiliere/outils/valider_reponses_evaluateurs.py

      - name: Validate pilot dossier template
        run: |
          python evaluation-immobiliere/outils/valider_fixtures_v0.py \
            --input evaluation-immobiliere/tests/fixtures/template_dossier_anonymise.json \
            --strict \
            --report-out evaluation-immobiliere/atelier/RAPPORT-VALIDATION-DOSSIER-PILOTE.md

      - name: Compile evaluator responses
        run: python evaluation-immobiliere/outils/compiler_reponses_evaluateurs.py

      - name: Rank MVP matrix
        run: python evaluation-immobiliere/outils/prioriser_mvp.py

      - name: Verify runtime coherence
        run: python evaluation-immobiliere/outils/verifier_coherence_runtime_v0.py

      - name: Verify skills registry and matrix
        run: python evaluation-immobiliere/outils/verifier_readiness_skills_v0.py

      - name: Verify redaction skills contract
        run: python evaluation-immobiliere/outils/verifier_contrat_redaction_skills_v0.py

      - name: Verify agent skills contracts
        run: python evaluation-immobiliere/outils/verifier_contrats_skills_agents_v0.py

      - name: Simulate runtime
        run: python evaluation-immobiliere/outils/simuler_runtime_engine_v0.py

      - name: Verify agent artifact contracts
        run: python evaluation-immobiliere/outils/verifier_contrats_artefacts_agents_v0.py

      - name: Verify business homologation
        run: python evaluation-immobiliere/outils/verifier_homologation_metier_v0.py

      - name: Verify external evaluator reviews strict gate
        run: python evaluation-immobiliere/outils/verifier_revues_evaluateurs_externes_v1.py --strict

      - name: Verify evaluator gap closure strict gate
        run: python evaluation-immobiliere/outils/verifier_fermeture_ecarts_evaluateurs_v1.py --strict

      - name: Verify release candidate strict gate
        run: python evaluation-immobiliere/outils/verifier_release_candidate_v1.py --strict

      - name: Refresh business homologation with release candidate
        run: python evaluation-immobiliere/outils/verifier_homologation_metier_v0.py --require-gap-closure

      - name: Verify runtime skills evidence
        run: python evaluation-immobiliere/outils/verifier_preuve_runtime_skills_v0.py

      - name: Analyze runtime integrity
        run: python evaluation-immobiliere/outils/analyser_integrite_runtime_v0.py

      - name: Generate pilot runtime report
        run: python evaluation-immobiliere/outils/generer_rapport_pilote_runtime_v0.py

      - name: Verify external pilot waiting mode
        run: |
          python evaluation-immobiliere/outils/executer_dossiers_pilotes_reels_v0.py \
            --allow-empty \
            --out-dir .test-tmp/runtime_pilotes_reels_waiting

      - name: Verify Phase H real field campaign gate
        run: |
          python evaluation-immobiliere/outils/verifier_campagne_terrain_reelle_v1.py \
            --runtime-dir .test-tmp/runtime_pilotes_reels_waiting \
            --report-out .test-tmp/runtime_pilotes_reels_waiting/phase_h_campagne_terrain_gate.json \
            --markdown-out .test-tmp/runtime_pilotes_reels_waiting/PHASE-H-CAMPAGNE-TERRAIN-GATE-V1.md

      - name: Verify project phase status
        run: python evaluation-immobiliere/outils/verifier_statut_phases_projet_v1.py

      - name: Verify generated artifacts are committed
        run: |
          git diff --exit-code -- \
            evaluation-immobiliere/atelier/RAPPORT-VALIDATION-DOSSIER-PILOTE.md \
            evaluation-immobiliere/atelier/RAPPORT-VALIDATION-REPONSES.md \
            evaluation-immobiliere/atelier/RAPPORT-PILOTE-RUNTIME-V0.md \
            evaluation-immobiliere/atelier/PV-HOMOLOGATION-V1.md \
            evaluation-immobiliere/atelier/PV-SIGNATURE-METIER-V1.md \
            evaluation-immobiliere/atelier/RELEASE-CANDIDATE-MANIFEST-V1.json \
            evaluation-immobiliere/atelier/STATUT-PHASES-PROJET-V1.json \
            evaluation-immobiliere/atelier/STATUT-PHASES-PROJET-V1.md \
            evaluation-immobiliere/atelier/RAPPORT-ECARTS-EVALUATEURS-EXTERNES-V1.md \
            evaluation-immobiliere/atelier/RAPPORT-DRESS-REHEARSAL-STAGING-V1.md \
            evaluation-immobiliere/atelier/RAPPORT-ROLLBACK-REHEARSAL-V1.md \
            evaluation-immobiliere/atelier/MATRICE-ECARTS-EVALUATEURS-EXTERNES-V1.csv \
            evaluation-immobiliere/atelier/MATRICE-PRIORISATION-MVP.csv \
            evaluation-immobiliere/atelier/MATRICE-PRIORISATION-MVP.md \
            evaluation-immobiliere/tests/runtime

      - name: Run unit tests
        run: python -m unittest discover -s evaluation-immobiliere/tests -p "test_*.py"
